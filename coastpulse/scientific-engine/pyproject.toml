[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coastpulse-scientific-engine"
version = "0.1.0"
description = "Core scientific SAR processing and validation engine for COASTPULSE platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "pydantic>=2.8.0",
]

[project.optional-dependencies]
geo = [
    "rasterio>=1.3.10",
    "geopandas>=1.0.0",
    "shapely>=2.0.4",
    "h5py>=3.11.0",
    "xarray>=2024.6.0",
    "scikit-image>=0.23.0",
]
test = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]
